[tool.poetry]
package-mode = false
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "PyTorch Lightning training with Comet tracking and DVC versioning"
authors = ["{{cookiecutter.author_name}}"]
readme = "README.md"

[tool.poetry.dependencies]
# Python: stable & supported by PyTorch + CUDA
python = ">=3.11,<3.13"

# Core PyTorch stack (matches container)
torch = "^2.2.2"
torchvision = "^0.17.2"
torchmetrics = "^1.3.2"

# Lightning (stable with torch 2.2)
lightning = "^2.2.5"

# Experiment tracking & infra
boto3 = "^1.34.80"
psycopg2-binary = "^2.9.9"
dvc = "^3.50.0"

# Data & config
omegaconf = "^2.3.0"
jsonargparse = { version = "^4.33.0", extras = ["signatures"] }
python-dotenv = "^1.0.1"

# Datasets
medmnist = "^3.0.2"

# Energy / sustainability
codecarbon = "^2.8.3"

# ONNX (compatible set)
onnx = "^1.15.0"
onnxruntime = "^1.17.3"
onnxruntime-tools = "^1.12.0"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
ruff = "^0.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
